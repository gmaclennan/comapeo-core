syntax = "proto3";

import "rpc.proto";

// Messages for the `comapeo/invite-link` channel, which is opened on a remote
// connection after the identity handshake and before the RPC channel. This is
// the only protocol an un-admitted remote peer can speak.
//
// Requests and responses are correlated by inviteId (plus the sending device's
// identity), which is the natural identity of "this device wants to join via
// this link". Field number 15 is deliberately left unused in every message so
// that a per-request id can be added compatibly if this channel ever carries
// more than one kind of request. (Not declared `reserved`: buf's breaking
// check would then forbid using the number later.)

// Invitee -> invitor: request admission with an invite link ID
message Redeem {
  bytes inviteId = 1;
  // Display info so the invitor can show who is asking before deciding
  string deviceName = 2;
  DeviceInfo.DeviceType deviceType = 3;
  // 15: kept free for a request id, see the file comment
}

// Invitor -> invitee: the redeem request was received and is awaiting a decision
message RedeemAck {
  bytes inviteId = 1;
  // 15: kept free for a request id, see the file comment
}

// Invitor -> invitee: admission granted, both sides open the RPC channel
message Admit {
  bytes inviteId = 1;
  // 15: kept free for a request id, see the file comment
}

// Invitor -> invitee: admission refused
message Deny {
  enum DenyReason {
    unspecified = 0;
    unknown_invite_id = 1;
    invitor_denied = 2;
    // The invitor failed to handle the request after acknowledging it
    invitor_error = 3;
  }
  bytes inviteId = 1;
  DenyReason reason = 2;
  // 15: kept free for a request id, see the file comment
}

// Invitee -> invitor: the deny was received, the invitor may now close
message DenyAck {
  bytes inviteId = 1;
  // 15: kept free for a request id, see the file comment
}
